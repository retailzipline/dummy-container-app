name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    name: validate image build
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are environment secrets on the "main"
    # environment, not repo secrets — without this line they resolve to empty
    # and the dhi.io login fails.
    environment: main
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile builds FROM dhi.io (Docker Hardened Images), which is an
      # authenticated registry — the runner has no credentials by default.
      # Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
      # Hub PAT with read access).
      - name: Log in to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dummy-container-app:ci
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          secrets: |
            TEST_BUILD_SECRET=${{ secrets.TEST_BUILD_SECRET || 'ci-dummy-secret' }}
          # No build cache on purpose: BuildKit excludes secret values from the
          # cache key, so a cached layer can carry a stale TEST_BUILD_SECRET and
          # make the smoke test pass against the wrong value. A cold build here
          # takes seconds.
          no-cache: true

      - name: Smoke test /info
        env:
          EXPECTED_VERSION: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:8080 dummy-container-app:ci

          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/info >/dev/null 2>&1 && break
            sleep 1
          done

          body=$(curl -fsS localhost:8080/info)
          echo "$body"

          version=$(echo "$body" | jq -r .version)
          secret=$(echo "$body" | jq -r .build_secret)

          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::version is '$version', expected '$EXPECTED_VERSION'"
            exit 1
          fi

          if [ -z "$secret" ] || [ "$secret" = "unknown" ] || [ "$secret" = "null" ]; then
            echo "::error::build secret was not baked into the image (got '$secret')"
            exit 1
          fi

          echo "ok: version and build secret are present"

      - name: Smoke test worker
        run: |
          set -euo pipefail
          # 1s interval so the check takes seconds, not half a minute.
          docker run -d --name worker -e WORKER_INTERVAL=1s dummy-container-app:ci worker
          sleep 4
          logs=$(docker logs worker 2>&1)
          echo "$logs"

          ticks=$(echo "$logs" | grep -c "stayin' alive" || true)
          if [ "$ticks" -lt 2 ]; then
            echo "::error::worker logged $ticks ticks in 4s, expected at least 2"
            exit 1
          fi

          # SIGTERM must stop it promptly; `docker stop` SIGKILLs after 10s.
          start=$(date +%s)
          docker stop worker >/dev/null
          elapsed=$(( $(date +%s) - start ))
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::worker ignored SIGTERM (took ${elapsed}s, was killed)"
            exit 1
          fi

          echo "ok: worker ticked $ticks times and stopped in ${elapsed}s"

      - name: Container logs
        if: always()
        run: |
          docker logs smoke || true
          docker logs worker || true

      - name: Cleanup
        if: always()
        run: docker rm -f smoke worker || true
