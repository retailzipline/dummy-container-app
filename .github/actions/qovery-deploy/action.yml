name: Qovery deploy
description: Deploy one Qovery environment at a given image tag.

inputs:
  token:
    description: Qovery CLI access token.
    required: true
  organization:
    description: Qovery organization.
    required: true
  project:
    description: Qovery project.
    required: true
  environment:
    description: Qovery environment to deploy.
    required: true
  tag:
    description: Image tag every service is deployed at.
    required: true
  skip_lifecycle:
    description: When 'true', omit --lifecycles entirely.
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        QOVERY_CLI_ACCESS_TOKEN: ${{ inputs.token }}
        ORGANIZATION: ${{ inputs.organization }}
        PROJECT: ${{ inputs.project }}
        ENVIRONMENT: ${{ inputs.environment }}
        TAG: ${{ inputs.tag }}
        SKIP_LIFECYCLE: ${{ inputs.skip_lifecycle }}
      run: |
        set -euo pipefail
        curl -s https://get.qovery.com | bash

        # Every service runs the same image, so they share one tag.
        args=(
          environment deploy
          --organization "$ORGANIZATION"
          --project "$PROJECT"
          --environment "$ENVIRONMENT"
          --containers "dummy-web-server:$TAG,dummy-worker:$TAG"
          --cronjobs "dummy-cronjob:$TAG"
        )

        # Omit the flag entirely when skipping - passing it empty would still
        # ask Qovery to deploy the lifecycle job.
        if [ "$SKIP_LIFECYCLE" = "true" ]; then
          note=" (lifecycle job skipped)"
        else
          args+=(--lifecycles "dummy-lifecycle-job:$TAG")
          note=""
        fi

        args+=(--watch)

        qovery "${args[@]}"

        echo "deployed \`$TAG\` to $ENVIRONMENT$note" >> "$GITHUB_STEP_SUMMARY"
